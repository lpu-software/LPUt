name: Build Main

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Install gcc
        run: choco install mingw

      - name: Build Windows Binary
        run: |
          go build -o bin/lput-agent.exe ./cmd/lput-agent
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          
      - name: Commit binary back to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bin/lput-agent.exe
          git commit -m "chore: auto-build windows binary" || exit 0
          git push
